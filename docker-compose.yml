services:
  backend:
    container_name: boiler-backend
    env_file: .env
    build:
     context: ./backend
     dockerfile: Dockerfile.prod
    image: boiler-backend-strapi:latest
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      NODE_ENV: ${NODE_ENV}
      HOST: ${STRAPI_HOST}
    volumes:
      - $PWD/backend/config:/opt/app/config
      - $PWD/backend/src:/opt/app/src
      - $PWD/backend/package.json:/opt/package.json
      - $PWD/backend/yarn.lock:/opt/yarn.lock
      - $PWD/.env:/opt/app/.env
      - $PWD/backend/public/uploads:/opt/app/public/uploads
    networks:
      - strapi
    depends_on:
      - db
  frontend:
    container_name: boiler-front
    env_file: .env
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    networks:
      - strapi
  db:
    env_file: .env
    container_name: boiler-db
    restart: unless-stopped
    platform: linux/amd64 #for platform error on Apple M1 chips
    image: postgres:16.0-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data/
    networks:
      - strapi
  caddy:
    container_name: boiler-proxy
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - strapi
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - $PWD/caddy/conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
  db_data:
networks:
  strapi:
    name: strapi
    driver: bridge
